[workspace]
resolver = "2"
members = ["crates/core", "crates/authn", "crates/wallet-wasm", "backend", "auth"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
thiserror = "1"
dotenvy = "0.15"

# Debug builds stay debuggable in our crates but run dependencies (crypto,
# serialization, PoW hashing) optimised, so a local node keeps up with the cluster.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
opt-level = 3
