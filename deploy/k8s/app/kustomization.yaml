apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chaindeal
resources:
  - backend.yaml
  - auth.yaml
  - frontend.yaml
  - sim.yaml
  - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: chaindeal-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=../../certs/tls.crt
      - tls.key=../../certs/tls.key
