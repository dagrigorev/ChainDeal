# Data tier. Secrets come from deploy/k8s/.secrets (generated by `make k8s-secrets`),
# init.lua from tarantool/ (copied by the Makefile).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chaindeal
resources:
  - namespace.yaml
  - tarantool.yaml
  - auth-db.yaml
  - network-policies.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: tarantool-init
    files:
      - init.lua=.generated/init.lua
      - probe.lua
  - name: auth-db-init
    files:
      - init.lua=.generated/auth-init.lua
secretGenerator:
  - name: chaindeal-db
    envs: [../.secrets/db.env]
  - name: chaindeal-auth
    envs: [../.secrets/auth.env]
  - name: chaindeal-seed
    envs: [../.secrets/seed.env]
  # OAuth client secret of the market simulator service (chaindeal-sim).
  - name: chaindeal-sim
    envs: [../.secrets/sim.env]
  # Market attestation key: signs contract documents; identical on every node.
  - name: chaindeal-attest
    envs: [../.secrets/attest.env]
