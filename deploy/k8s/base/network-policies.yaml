# Zero-trust networking inside the namespace: nothing is reachable unless
# listed here.
#   ingress controller  → frontend, backend, auth (8080)
#   backend             → auth (8080, JWKS only needs this)
#   backend, bulk job   → tarantool (3301)
#   tarantool           ↔ tarantool (replication)
#   auth                → auth-db (3301) — nothing else can reach identity data
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-from-ingress }
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [frontend, backend, auth] }]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress } }
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: auth-from-backend }
spec:
  podSelector: { matchLabels: { app: auth } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: tarantool-clients }
spec:
  podSelector: { matchLabels: { app: tarantool } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: chaindeal-bulk } }
        - podSelector: { matchLabels: { app: tarantool } }
      ports: [{ port: 3301 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: auth-db-clients }
spec:
  podSelector: { matchLabels: { app: auth-db } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: auth } }
      ports: [{ port: 3301 }]
