// ChainDeal ledger streaming API.
//
// Served by every chain node on port 9090:
//   - native gRPC (HTTP/2) for services, e.g. the market simulator;
//   - gRPC-Web for browsers, through the ingress at https://chaindeal.localhost.
//
// Rust stubs are generated by backend/build.rs, TypeScript by `npm run proto`
// in frontend/.
syntax = "proto3";

package chaindeal.v1;

service LedgerService {
  // Everything the cluster does, as it happens: admissions, refusals,
  // rejections, sealed blocks and leader changes. Every event carries the
  // cluster-wide sequence number of the shared event log; pass the last one
  // seen as `after_seq` to resume after a reconnect without gaps (the log
  // keeps the last 15 minutes).
  rpc Watch(WatchRequest) returns (stream LedgerEvent);

  // Committed blocks with their full signed transactions, starting at
  // `from_height`: first the history (catch-up), then live as blocks are sealed.
  // Resumable: pass the last height received + 1.
  rpc FollowBlocks(FollowBlocksRequest) returns (stream SealedBlock);

  // Streams signed transactions into the mempool and answers each one with a
  // receipt (matched by `ref`). Requires `authorization: Bearer <token>` with
  // scope `deals:write`; the sender wallet must be linked to the account,
  // unless the token has `tx:any` (service clients).
  rpc SubmitTxs(stream SubmitTxsRequest) returns (stream TxReceipt);
}

message WatchRequest {
  // Resume after this sequence number (0 = live only).
  uint64 after_seq = 1;
  // Attach every transaction of a sealed block to its `BlockSealed` event.
  bool with_transactions = 2;
}

message LedgerEvent {
  uint64 seq = 1;
  oneof event {
    TxPending pending = 10;
    TxRefused refused = 11;
    TxRejected rejected = 12;
    BlockSealed block = 13;
    LeaderChanged leader = 14;
  }
}

// A transaction passed admission and waits in the mempool.
message TxPending {
  string hash = 1;
  string action = 2;
}

// A transaction was refused at admission (bad signature, fails the contract).
message TxRefused {
  string error = 1;
}

// A queued transaction failed when its block was produced.
message TxRejected {
  string hash = 1;
  string from = 2;
  string error = 3;
}

message BlockSealed {
  uint64 height = 1;
  string hash = 2;
  uint32 tx_count = 3;
  uint32 rejected = 4;
  // Every deal whose status changed in this block.
  repeated DealTransition transitions = 5;
  // Accounts whose balances or deals changed.
  repeated string accounts = 6;
  // Only with `WatchRequest.with_transactions`.
  repeated Transaction transactions = 7;
}

message DealTransition {
  string id = 1;
  // Empty for a deal created in this block.
  string from = 2;
  string to = 3;
  string deal_type = 4;
  uint64 amount = 5;
  string title = 6;
}

message LeaderChanged {
  string node = 1;
  bool leader = 2;
}

message FollowBlocksRequest {
  uint64 from_height = 1;
  // Stop after this height (0 = follow forever).
  uint64 to_height = 2;
}

message SealedBlock {
  BlockHeader header = 1;
  string hash = 2;
  repeated Transaction transactions = 3;
}

message BlockHeader {
  uint64 height = 1;
  string prev_hash = 2;
  uint64 timestamp = 3;
  string merkle_root = 4;
  uint32 tx_count = 5;
  uint32 difficulty = 6;
  uint64 nonce = 7;
  string producer = 8;
}

// A signed transaction. `body_json` is the canonical JSON the ed25519
// signature covers, so any client can re-verify it independently.
message Transaction {
  string hash = 1;
  string body_json = 2;
  string signature = 3;
  // Summary fields, for display without parsing the body.
  string from = 4;
  string action = 5;
  string status = 6;
  string error = 7;
  uint64 block_height = 8;
  string deal_id = 9;
}

message SubmitTxsRequest {
  // Chosen by the client, echoed in the receipt.
  uint64 ref = 1;
  string hash = 2;
  string body_json = 3;
  string signature = 4;
}

message TxReceipt {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // Queued for the next block.
    OUTCOME_ADMITTED = 1;
    // Malformed, bad signature, stale, or a duplicate.
    OUTCOME_INVALID = 2;
    // Well-formed but the contract refuses it (e.g. insufficient funds).
    OUTCOME_REJECTED = 3;
    // Not permitted for this caller (wallet not linked).
    OUTCOME_FORBIDDEN = 4;
    // The node could not process it; safe to retry.
    OUTCOME_ERROR = 5;
  }
  uint64 ref = 1;
  string hash = 2;
  Outcome outcome = 3;
  string error = 4;
  string deal_id = 5;
}
