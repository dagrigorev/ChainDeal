[package]
name = "chaindeal-backend"
version.workspace = true
edition.workspace = true

[dependencies]
dotenvy.workspace = true
chaindeal-core = { path = "../crates/core" }
chaindeal-authn = { path = "../crates/authn" }
ed25519-dalek.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tarantool-rs = "0.0.10"
rmpv = { version = "1", features = ["with-serde"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
rand = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
# gRPC: the Ledger streaming service (native gRPC + gRPC-Web) and its clients.
tonic = "0.14"
tonic-prost = "0.14"
tonic-web = "0.14"
tonic-reflection = "0.14"
prost = "0.14"

[build-dependencies]
# Compiles proto/ in pure Rust: no protoc needed on the host or in Docker.
tonic-prost-build = "0.14"
protox = "0.9"
prost = "0.14"
